name: CI

on:
  push:
    branches: [feature, dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  boot-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install

      - name: Syntax check
        run: node --check server.js

      - name: Boot server and hit /healthz
        run: |
          node server.js &
          SERVER_PID=$!
          for i in 1 2 3 4 5; do
            sleep 1
            if curl -sf http://localhost:8080/healthz; then
              echo "server is up"
              kill $SERVER_PID
              exit 0
            fi
          done
          echo "server never came up"
          kill $SERVER_PID
          exit 1
